
{% extends "base.html" %}
{% block title %}MySQL Database Connection - LabSync{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
        <div class="auth-header">
            <span class="auth-avatar"><img class="ui-icon" src="{{ url_for('static', filename='icons/dashboard.svg') }}" alt=""></span>
            <h2 class="auth-title">MySQL Database Settings</h2>
            <p class="auth-subtitle">Configure your local MySQL server connection parameters</p>
        </div>

        <!-- Database Connection Form -->
        <form method="POST" action="{{ url_for('db_settings') }}" class="auth-form">
            <div class="form-group">
                <label class="form-label">MySQL Host</label>
                <input type="text" name="host" class="form-input" value="{{ config.MYSQL_HOST }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Port</label>
                <input type="number" name="port" class="form-input" value="{{ config.MYSQL_PORT }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="user" class="form-input" value="{{ config.MYSQL_USER }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" value="{{ config.MYSQL_PASSWORD }}" placeholder="Enter MySQL root password (leave blank if none)">
                <span class="text-muted text-sm mt-1 block">Your MySQL root password.</span>
            </div>
            <div class="form-group">
                <label class="form-label">Database Name</label>
                <input type="text" name="database" class="form-input" value="{{ config.MYSQL_DB }}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Test Connection & Save &rarr;</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('index') }}" class="link-bold">&larr; Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
